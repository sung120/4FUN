<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>婚禮即時互動問答</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-pink-50 text-gray-800">
  <div id="app" class="min-h-screen flex flex-col justify-between p-4">
    
    <!-- 大螢幕端 (?view=screen) -->
    <template v-if="isScreenView">
      <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col justify-between py-2">
        <!-- 大廳等待畫面 -->
        <div v-if="status === 'LOBBY' || currentQ === 0" class="flex-1 flex flex-col items-center justify-center bg-white p-12 rounded-3xl shadow-2xl text-center my-auto">
          <h1 class="text-5xl font-extrabold text-pink-600 mb-6">💕 婚禮互動問答大廳</h1>
          <p class="text-2xl text-gray-600 mb-8">請掃描 QR Code 或輸入網址加入遊戲！</p>
          <div class="bg-pink-100 border-4 border-pink-300 px-8 py-6 rounded-2xl mb-10">
            <span class="text-3xl font-bold text-gray-700">目前參賽人數：</span>
            <span class="text-5xl font-extrabold text-pink-600 ml-3">{{ playerCount }} 人</span>
          </div>
          <div class="flex gap-6">
            <button @click="resetGame" class="bg-red-500 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">🔄 重置遊戲</button>
            <button @click="startGame" class="bg-green-600 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">▶ 開始遊戲</button>
          </div>
        </div>

        <!-- 遊戲結束結算與排行榜畫面 -->
        <div v-else-if="status === 'FINISHED'" class="flex-1 flex flex-col items-center justify-center bg-white p-12 rounded-3xl shadow-2xl text-center my-auto">
          <h1 class="text-5xl font-extrabold text-pink-600 mb-6">🏆 最終英雄榜</h1>
          <div class="w-full max-w-xl bg-pink-50 p-6 rounded-2xl mb-8 border-2 border-pink-200">
            <div v-for="(p, index) in leaderboard" :key="p.id" class="flex justify-between items-center py-3 border-b border-pink-200 text-xl font-bold">
              <span>第 {{ index + 1 }} 名：{{ p.name }}</span>
              <span class="text-pink-600">{{ p.score }} 分</span>
            </div>
          </div>
          <button @click="resetGame" class="bg-red-500 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">🔄 重新開始遊戲</button>
        </div>

        <!-- 遊戲進行中畫面 -->
        <div v-else class="flex-1 flex flex-col justify-between bg-white p-8 rounded-3xl shadow-2xl my-auto">
          <div class="flex justify-between items-center border-b pb-4 mb-6">
            <span class="text-3xl font-extrabold text-pink-600">第 {{ currentQ }} 題 / 共 {{ questions.length }} 題 ｜ 倒數計時：<span class="text-red-500">{{ timer }}</span> 秒</span>
            <button @click="nextQuestion" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-2xl font-bold text-lg shadow">下一題 / 結束本題</button>
          </div>
          
          <div class="text-center my-auto" v-if="currentQuestion">
            <h2 class="text-4xl font-bold text-gray-800 mb-10">{{ currentQuestion.question }}</h2>
            <div class="grid grid-cols-2 gap-6 max-w-4xl mx-auto">
              <div v-for="(opt, idx) in [currentQuestion.option_a, currentQuestion.option_b, currentQuestion.option_c, currentQuestion.option_d]" :key="idx" 
                   class="bg-pink-50 border-2 border-pink-200 p-6 rounded-2xl text-2xl font-semibold text-gray-700 shadow">
                {{ ['A', 'B', 'C', 'D'][idx] }}. {{ opt }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 手機答題端 -->
    <template v-else>
      <div class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center py-4">
        <!-- 登入畫面 -->
        <div v-if="!joined" class="bg-white p-6 rounded-2xl shadow-xl text-center">
          <h2 class="text-2xl font-bold text-pink-600 mb-2">💕 婚禮即時搶答</h2>
          <p class="text-gray-500 mb-4">輸入名字即可參與互動搶答！</p>
          <input v-model="inputName" type="text" placeholder="請輸入您的姓名或桌號" class="w-full border p-3 rounded-lg mb-4 text-center text-lg">
          <button @click="joinGame" class="w-full bg-pink-500 text-white py-3 rounded-lg font-bold text-lg shadow">進入遊戲</button>
        </div>

        <!-- 手機端結算畫面 -->
        <div v-else-if="status === 'FINISHED'" class="bg-white p-6 rounded-2xl shadow-xl text-center py-10">
          <h2 class="text-3xl font-bold text-pink-600 mb-4">🎉 互動問答圓滿結束！</h2>
          <p class="text-gray-600 text-lg mb-4">謝謝 <span class="font-bold text-pink-600">{{ nickname }}</span> 的熱情參與！</p>
          <div class="text-2xl font-bold text-pink-500 bg-pink-50 p-4 rounded-xl border border-pink-200">你的最終得分：{{ myScore }} 分</div>
        </div>

        <!-- 遊戲進行中答題畫面 -->
        <div v-else class="bg-white p-6 rounded-2xl shadow-xl">
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <span class="font-bold text-pink-600">玩家：{{ nickname }}</span>
            <span class="text-sm font-bold text-red-500">⏳ {{ timer }}s</span>
          </div>

          <!-- 等待開始 -->
          <div v-if="status === 'LOBBY' || currentQ === 0" class="text-center py-10">
            <div class="text-6xl mb-4">⏳</div>
            <h3 class="text-xl font-bold text-gray-700">請等待新郎新娘開始遊戲...</h3>
          </div>

          <!-- 作答中 -->
          <div v-else-if="currentQuestion">
            <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">第 {{ currentQ }} 題：{{ currentQuestion.question }}</h3>
            <div class="flex flex-col gap-3">
              <button v-for="(opt, idx) in [currentQuestion.option_a, currentQuestion.option_b, currentQuestion.option_c, currentQuestion.option_d]" :key="idx" 
                      @click="submitAnswer(idx)"
                      :class="selectedOption === idx ? 'bg-pink-600 text-white' : 'bg-pink-50 hover:bg-pink-100 text-gray-800 border border-pink-200'"
                      class="p-4 rounded-xl font-bold text-lg transition shadow-sm">
                {{ ['A', 'B', 'C', 'D'][idx] }}. {{ opt }}
              </button>
            </div>
            <div v-if="submitted" class="mt-4 text-center text-green-600 font-bold">✓ 答案已送出！</div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const SUPABASE_URL = 'https://qpqdpesalezkhdxupsyh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__lE9VwdNJUzNwVqURD5I7w_PJCf6CSs';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    createApp({
      setup() {
        const isScreenView = ref(window.location.search.includes('view=screen'));
        const status = ref('LOBBY');
        const currentQ = ref(0);
        const playerCount = ref(0);
        const inputName = ref('');
        const nickname = ref(localStorage.getItem('wedding_name') || '');
        const playerId = ref(localStorage.getItem('wedding_pid') || '');
        const joined = ref(!!playerId.value);
        
        // 雙保險內建題庫（對應你的 Supabase 欄位格式）
        const questions = ref([
          { id: 1, question: "他們養了幾隻貓？", option_a: "1", option_b: "2", option_c: "3", option_d: "4", answer: "OptionC" },
          { id: 2, question: "他們誰比較老？", option_a: "新郎", option_b: "新娘", option_c: "一樣老", option_d: "都18歲", answer: "OptionA" },
          { id: 3, question: "他們把哪間婚紗公司拍倒閉了？", option_a: "沒有拍婚紗", option_b: "貝拉婚紗", option_c: "莎琪瑪婚紗攝影", option_d: "韓國藝匠", answer: "OptionD" },
          { id: 4, question: "今天排隊順序是怎麼排序的？", option_a: "比體重重", option_b: "由左至右按照順序", option_c: "比身高高", option_d: "由前往後按照順序", answer: "OptionD" },
          { id: 5, question: "那隻顏色的貓最喜歡新郎做報告/論文？", option_a: "白貓，小白", option_b: "橘貓，幾多多", option_c: "三花貓，樂樂", option_d: "以上皆是", answer: "OptionD" }
        ]);

        const currentQuestion = computed(() => {
          if (currentQ.value > 0 && currentQ.value <= questions.value.length) {
            return questions.value[currentQ.value - 1];
          }
          return null;
        });

        const selectedOption = ref(null);
        const submitted = ref(false);
        const timer = ref(15);
        const myScore = ref(0);
        const leaderboard = ref([]);
        let timerInterval = null;

        const fetchState = async () => {
          let { data } = await db.from('game_state').select('*').eq('id', 1).single();
          if (data) {
            status.value = data.status;
            currentQ.value = data.current_q;
          }
          let { count } = await db.from('players').select('*', { count: 'exact', head: true });
          playerCount.value = count || 0;

          if (playerId.value) {
            let { data: pData } = await db.from('players').select('score').eq('id', playerId.value).single();
            if (pData) myScore.value = pData.score;
          }
        };

        const fetchLeaderboard = async () => {
          let { data } = await db.from('players').select('*').order('score', { ascending: false }).limit(5);
          if (data) leaderboard.value = data;
        };

        onMounted(async () => {
          await fetchState();

          db.channel('public:game_state')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, payload => {
              status.value = payload.new.status;
              currentQ.value = payload.new.current_q;
              if (payload.new.status === 'FINISHED') {
                fetchLeaderboard();
              }
              if (payload.new.status === 'PLAYING') {
                selectedOption.value = null;
                submitted.value = false;
                startTimer();
              }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => {
              fetchState();
            })
            .subscribe();
        });

        const startTimer = () => {
          clearInterval(timerInterval);
          timer.value = 15;
          timerInterval = setInterval(() => {
            if (timer.value > 0) {
              timer.value--;
            } else {
              clearInterval(timerInterval);
            }
          }, 1000);
        };

        const joinGame = async () => {
          if (!inputName.value.trim()) return alert('請輸入名字');
          const id = 'P_' + Math.random().toString(36).substring(2, 9);
          // 確保寫入玩家時不報錯
          const { error } = await db.from('players').insert([{ id, name: inputName.value.trim(), score: 0 }]);
          if (error) {
            alert('加入失敗，請再試一次');
            return;
          }
          localStorage.setItem('wedding_pid', id);
          localStorage.setItem('wedding_name', inputName.value.trim());
          playerId.value = id;
          nickname.value = inputName.value.trim();
          joined.value = true;
          fetchState();
        };

        const startGame = async () => {
          await db.from('game_state').update({ current_q: 1, status: 'PLAYING', start_time: Date.now() }).eq('id', 1);
        };

        const nextQuestion = async () => {
          let nextQ = currentQ.value + 1;
          if (nextQ > questions.value.length) {
            await db.from('game_state').update({ status: 'FINISHED' }).eq('id', 1);
            fetchLeaderboard();
            return;
          }
          await db.from('game_state').update({ current_q: nextQ, status: 'PLAYING', start_time: Date.now() }).eq('id', 1);
        };

        const submitAnswer = async (idx) => {
          if (submitted.value) return;
          selectedOption.value = idx;
          submitted.value = true;

          const mapOpt = ['OptionA', 'OptionB', 'OptionC', 'OptionD'];
          if (currentQuestion.value && mapOpt[idx] === currentQuestion.value.answer) {
            let addScore = 10 + timer.value; 
            myScore.value += addScore;
            await db.from('players').update({ score: myScore.value }).eq('id', playerId.value);
          }
        };

        const resetGame = async () => {
          if (confirm('確定重置遊戲？')) {
            await db.from('players').delete().neq('id', '0');
            await db.from('game_state').update({ current_q: 0, status: 'LOBBY', start_time: 0 }).eq('id', 1);
            location.reload();
          }
        };

        return {
          isScreenView, status, currentQ, playerCount, inputName, nickname, joined,
          questions, currentQuestion, selectedOption, submitted, timer, myScore, leaderboard,
          joinGame, startGame, nextQuestion, submitAnswer, resetGame
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
