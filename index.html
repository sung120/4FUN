<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>婚禮即時互動問答</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-pink-50 text-gray-800">
  <div id="app" class="min-h-screen flex flex-col justify-between p-4">
    
    <!-- 大螢幕端 (?view=screen) -->
    <template v-if="isScreenView">
      <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col justify-between py-2">
        <!-- 大廳等待畫面 -->
        <div v-if="status === 'LOBBY' || currentQ === 0" class="flex-1 flex flex-col items-center justify-center bg-white p-12 rounded-3xl shadow-2xl text-center my-auto">
          <h1 class="text-5xl font-extrabold text-pink-600 mb-6">💕 婚禮互動問答大廳</h1>
          <p class="text-2xl text-gray-600 mb-8">請掃描 QR Code 或輸入網址加入遊戲！</p>
          <div class="bg-pink-100 border-4 border-pink-300 px-8 py-6 rounded-2xl mb-10">
            <span class="text-3xl font-bold text-gray-700">目前已連接題庫：</span>
            <span class="text-5xl font-extrabold text-pink-600 ml-3">{{ questions.length }} 題</span>
            <span class="text-3xl font-bold text-gray-700 ml-6">參賽人數：</span>
            <span class="text-5xl font-extrabold text-pink-600 ml-3">{{ playersList.length }} 人</span>
          </div>
          <div class="flex flex-wrap justify-center gap-3 max-w-2xl mb-8 max-h-40 overflow-y-auto">
            <span v-for="p in playersList" :key="p.id" class="bg-pink-50 border border-pink-200 px-4 py-2 rounded-full text-lg font-bold text-pink-600 shadow-sm">
              {{ p.name }}
            </span>
          </div>
          <div class="flex gap-6">
            <button @click="resetGame" class="bg-red-500 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">🔄 重置遊戲</button>
            <button @click="startGame" class="bg-green-600 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">▶ 開始遊戲</button>
          </div>
        </div>

        <!-- 遊戲結束結算畫面 -->
        <div v-else-if="status === 'FINISHED'" class="flex-1 flex flex-col items-center justify-center bg-white p-12 rounded-3xl shadow-2xl text-center my-auto">
          <h1 class="text-5xl font-extrabold text-pink-600 mb-6">🏆 最終英雄榜</h1>
          <div class="w-full max-w-xl bg-pink-50 p-6 rounded-2xl mb-8 border-2 border-pink-200">
            <div v-for="(p, index) in leaderboard" :key="p.id" class="flex justify-between items-center py-3 border-b border-pink-200 text-xl font-bold">
              <span>第 {{ index + 1 }} 名：{{ p.name }}</span>
              <span class="text-pink-600">{{ p.score }} 分</span>
            </div>
          </div>
          <button @click="resetGame" class="bg-red-500 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg">🔄 重新開始遊戲</button>
        </div>

        <!-- 遊戲進行中畫面 -->
        <div v-else class="flex-1 flex flex-col justify-between bg-white p-8 rounded-3xl shadow-2xl my-auto">
          <div class="flex justify-between items-center border-b pb-4 mb-6">
            <span class="text-3xl font-extrabold text-pink-600">第 {{ currentQ }} 題 / 共 {{ questions.length }} 題 ｜ 倒數計時：<span :class="timer === 0 ? 'text-gray-400' : 'text-red-500'">{{ timer }}</span> 秒</span>
            <button @click="nextQuestion" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-2xl font-bold text-lg shadow">下一題 / 結算本題</button>
          </div>
          
          <div class="text-center my-auto" v-if="currentQuestion">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">{{ currentQuestion.question }}</h2>
            
            <!-- 如果資料庫有填圖片連結則顯示圖片 -->
            <div v-if="currentQuestion.image" class="mb-6 flex justify-center">
              <img :src="currentQuestion.image" alt="題目圖片" class="max-h-64 rounded-2xl shadow-md border-2 border-pink-200 object-contain">
            </div>

            <div class="grid grid-cols-2 gap-6 max-w-4xl mx-auto mb-6">
              <div v-for="(opt, idx) in [currentQuestion.option_a, currentQuestion.option_b, currentQuestion.option_c, currentQuestion.option_d]" :key="idx" 
                   :class="timer === 0 && ['OptionA', 'OptionB', 'OptionC', 'OptionD'][idx] === currentQuestion.answer ? 'bg-green-300 border-green-600 ring-4 ring-green-400' : 'bg-pink-50 border-pink-200'"
                   class="border-2 p-5 rounded-2xl text-xl font-semibold text-gray-700 shadow transition-all">
                {{ ['A', 'B', 'C', 'D'][idx] }}. {{ opt }}
              </div>
            </div>
            
            <div class="bg-pink-50 p-3 rounded-2xl border border-pink-200 max-w-xl mx-auto">
              <h3 class="font-bold text-pink-600 mb-1 text-sm">🔥 即時戰況排行榜前三名</h3>
              <div class="flex justify-around text-base font-bold">
                <span v-for="(p, idx) in leaderboard.slice(0, 3)" :key="p.id">
                  {{ ['🥇','🥈','🥉'][idx] }} {{ p.name }} ({{ p.score }}分)
                </span>
                <span v-if="leaderboard.length === 0" class="text-gray-400">尚無計分資料</span>
              </div>
            </div>

            <div v-if="timer === 0" class="mt-4 text-xl font-bold text-green-600 animate-bounce">✨ 時間到！公佈正確答案 ✨</div>
          </div>
        </div>
      </div>
    </template>

    <!-- 手機答題端 -->
    <template v-else>
      <div class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center py-4">
        <!-- 登入畫面 -->
        <div v-if="!joined" class="bg-white p-6 rounded-2xl shadow-xl text-center">
          <h2 class="text-2xl font-bold text-pink-600 mb-2">💕 婚禮即時搶答</h2>
          <p class="text-gray-500 mb-4">輸入名字即可參與互動搶答！</p>
          <input v-model="inputName" type="text" placeholder="請輸入您的姓名或桌號" class="w-full border p-3 rounded-lg mb-4 text-center text-lg">
          <button @click="joinGame" class="w-full bg-pink-500 text-white py-3 rounded-lg font-bold text-lg shadow">進入遊戲</button>
        </div>

        <!-- 手機端結算畫面 -->
        <div v-else-if="status === 'FINISHED'" class="bg-white p-6 rounded-2xl shadow-xl text-center py-10">
          <h2 class="text-3xl font-bold text-pink-600 mb-4">🎉 互動問答圓滿結束！</h2>
          <p class="text-gray-600 text-lg mb-4">謝謝 <span class="font-bold text-pink-600">{{ nickname }}</span> 的熱情參與！</p>
          <div class="text-2xl font-bold text-pink-500 bg-pink-50 p-4 rounded-xl border border-pink-200 mb-6">你的最終得分：{{ myScore }} 分</div>
          <button @click="forceRejoin" class="w-full bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg font-bold text-lg shadow">🔄 重新輸入名字加入</button>
        </div>

        <!-- 遊戲進行中答題畫面 -->
        <div v-else class="bg-white p-6 rounded-2xl shadow-xl">
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <span class="font-bold text-pink-600">玩家：{{ nickname }} ({{ myScore }}分)</span>
            <span class="text-sm font-bold" :class="timer === 0 ? 'text-gray-400' : 'text-red-500'">⏳ {{ timer === 0 ? '時間到' : timer + 's' }}</span>
          </div>

          <!-- 等待開始 -->
          <div v-if="status === 'LOBBY' || currentQ === 0" class="text-center py-10">
            <div class="text-6xl mb-4">⏳</div>
            <h3 class="text-xl font-bold text-gray-700 mb-4">您已成功加入，請等待新郎新娘開始遊戲...</h3>
            <button @click="forceRejoin" class="text-sm text-pink-500 underline">換個名字或重新加入？</button>
          </div>

          <!-- 作答中 -->
          <div v-else-if="currentQuestion">
            <h3 class="text-base font-bold text-gray-800 mb-2 text-center">第 {{ currentQ }} 題：{{ currentQuestion.question }}</h3>
            
            <!-- 手機端若有圖片也顯示縮圖 -->
            <div v-if="currentQuestion.image" class="mb-3 flex justify-center">
              <img :src="currentQuestion.image" alt="題目圖片" class="max-h-36 rounded-xl shadow border object-contain">
            </div>

            <div class="flex flex-col gap-2">
              <button v-for="(opt, idx) in [currentQuestion.option_a, currentQuestion.option_b, currentQuestion.option_c, currentQuestion.option_d]" :key="idx" 
                      @click="submitAnswer(idx)"
                      :disabled="timer === 0 || submitted"
                      :class="[
                        selectedOption === idx ? 'bg-pink-600 text-white' : 'bg-pink-50 hover:bg-pink-100 text-gray-800 border border-pink-200',
                        (timer === 0 || submitted) ? 'opacity-80 cursor-not-allowed' : ''
                      ]"
                      class="p-3 rounded-xl font-bold text-base transition shadow-sm">
                {{ ['A', 'B', 'C', 'D'][idx] }}. {{ opt }}
              </button>
            </div>
            
            <div v-if="submitted && timer > 0" class="mt-3 text-center text-green-600 font-bold">✓ 答案已送出，等待時間到揭曉！</div>
            <div v-if="timer === 0" class="mt-3 p-3 rounded-xl bg-gray-50 border text-center font-bold">
              <span v-if="isCorrect" class="text-green-600 text-lg">🎉 答對了！獲得分數！</span>
              <span v-else class="text-red-500 text-lg">❌ 答錯了或未作答！</span>
              <div class="text-sm text-gray-600 mt-1">正確答案是：{{ currentQuestion.answer.replace('Option', '') }}</div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const SUPABASE_URL = 'https://qpqdpesalezkhdxupsyh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__lE9VwdNJUzNwVqURD5I7w_PJCf6CSs';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    createApp({
      setup() {
        const isScreenView = ref(window.location.search.includes('view=screen'));
        const status = ref('LOBBY');
        const currentQ = ref(0);
        const playerCount = ref(0);
        const playersList = ref([]);
        const inputName = ref('');
        const nickname = ref(localStorage.getItem('wedding_name') || '');
        const playerId = ref(localStorage.getItem('wedding_pid') || '');
        const joined = ref(!!playerId.value);
        
        const questions = ref([]);
        const currentQuestion = computed(() => {
          if (currentQ.value > 0 && questions.value.length > 0 && currentQ.value <= questions.value.length) {
            return questions.value[currentQ.value - 1];
          }
          return null;
        });

        const selectedOption = ref(null);
        const submitted = ref(false);
        const myAnswer = ref(null);
        const isCorrect = ref(false);
        const timer = ref(15);
        const myScore = ref(0);
        const leaderboard = ref([]);
        let timerInterval = null;

        // 從資料庫動態抓取全部題目（支援無限多題與圖片）
        const fetchQuestions = async () => {
          let { data } = await db.from('questions').select('*').order('id', { ascending: true });
          if (data && data.length > 0) {
            questions.value = data;
          }
        };

        const fetchState = async () => {
          let { data } = await db.from('game_state').select('*').eq('id', 1).maybeSingle();
          if (data) {
            status.value = data.status;
            currentQ.value = data.current_q;
          }

          let { data: pData, count } = await db.from('players').select('*', { count: 'exact' }).order('score', { ascending: false });
          if (pData) {
            playersList.value = pData;
            leaderboard.value = pData;
            playerCount.value = count || pData.length;
          }

          if (playerId.value) {
            let myData = pData?.find(p => p.id === playerId.value);
            if (myData) {
              myScore.value = myData.score;
            } else {
              joined.value = false;
              localStorage.removeItem('wedding_pid');
              localStorage.removeItem('wedding_name');
            }
          }
        };

        onMounted(async () => {
          await fetchQuestions();
          await fetchState();

          db.channel('public:game_state')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, payload => {
              status.value = payload.new.status;
              currentQ.value = payload.new.current_q;
              
              if (payload.new.status === 'PLAYING') {
                selectedOption.value = null;
                submitted.value = false;
                myAnswer.value = null;
                isCorrect.value = false;
                startTimer();
              }
              fetchState();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => {
              fetchState();
            })
            .subscribe();
        });

        const startTimer = () => {
          clearInterval(timerInterval);
          timer.value = 15;
          timerInterval = setInterval(async () => {
            if (timer.value > 0) {
              timer.value--;
              if (timer.value === 0) {
                // 當時間歸零時，前端自動核對答案並計算分數寫入資料庫（只計算一次）
                await evaluateAnswer();
              }
            }
          }, 1000);
        };

        const joinGame = async () => {
          if (!inputName.value.trim()) return alert('請輸入名字');
          const id = 'P_' + Math.random().toString(36).substring(2, 9);
          const { error } = await db.from('players').insert([{ id, name: inputName.value.trim(), score: 0 }]);
          if (error) {
            alert('加入失敗，請再試一次');
            return;
          }
          localStorage.setItem('wedding_pid', id);
          localStorage.setItem('wedding_name', inputName.value.trim());
          playerId.value = id;
          nickname.value = inputName.value.trim();
          joined.value = true;
          fetchState();
        };

        const forceRejoin = () => {
          localStorage.removeItem('wedding_pid');
          localStorage.removeItem('wedding_name');
          playerId.value = '';
          nickname.value = '';
          joined.value = false;
          inputName.value = '';
        };

        const startGame = async () => {
          await db.from('game_state').update({ current_q: 1, status: 'PLAYING', start_time: Date.now() }).eq('id', 1);
        };

        const nextQuestion = async () => {
          let nextQ = currentQ.value + 1;
          if (nextQ > questions.value.length) {
            await db.from('game_state').update({ status: 'FINISHED' }).eq('id', 1);
            return;
          }
          await db.from('game_state').update({ current_q: nextQ, status: 'PLAYING', start_time: Date.now() }).eq('id', 1);
        };

        // 玩家點擊選項（此時不馬上加分，僅記錄選擇）
        const submitAnswer = (idx) => {
          if (submitted.value || timer.value === 0) return;
          selectedOption.value = idx;
          submitted.value = true;
          myAnswer.value = idx;
        };

        // 時間到或切換題目時統一結算得分
        const evaluateAnswer = async () => {
          if (myAnswer.value !== null && currentQuestion.value) {
            const mapOpt = ['OptionA', 'OptionB', 'OptionC', 'OptionD'];
            if (mapOpt[myAnswer.value] === currentQuestion.value.answer) {
              isCorrect.value = true;
              let addScore = 10; // 答對基礎分
              myScore.value += addScore;
              await db.from('players').update({ score: myScore.value }).eq('id', playerId.value);
              fetchState();
            } else {
              isCorrect.value = false;
            }
          } else {
            isCorrect.value = false;
          }
        };

        const resetGame = async () => {
          if (confirm('確定重置遊戲？這將會清空所有玩家與分數！')) {
            await db.from('players').delete().neq('id', '0');
            await db.from('game_state').update({ current_q: 0, status: 'LOBBY', start_time: 0 }).eq('id', 1);
          }
        };

        return {
          isScreenView, status, currentQ, playerCount, playersList, inputName, nickname, joined,
          questions, currentQuestion, selectedOption, submitted, isCorrect, timer, myScore, leaderboard,
          joinGame, forceRejoin, startGame, nextQuestion, submitAnswer, resetGame
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
